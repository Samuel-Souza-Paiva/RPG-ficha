<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ficha Sombria">
  <title>Ficha Sombria</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Grenze+Gotisch:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- filtros de "traço de pena": deixam as molduras tremidas como nanquim -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="tinta" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="3.5"/>
    </filter>
    <filter id="tinta-fina" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="2" result="r"/>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="2"/>
    </filter>
  </svg>
  <div id="fundo" aria-hidden="true"></div>
  <div id="cinzas" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
